<!doctype html>
<html lang="sr-Cyrl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d6f42">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">

<style>
:root{
  --bg:#f3f5f4; --card:#ffffff; --text:#14181a; --muted:#6b7378; --line:#e3e7e5;
  --acc:#1d8a55; --acc2:#21a366; --accbg:#e4f4ec; --danger:#d93f3f; --warn:#c77a00; --warnbg:#fff4de;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#111315; --card:#1c1f22; --text:#eef1f2; --muted:#9aa3a8; --line:#2c3135;
        --accbg:#173326; --warnbg:#3a2e14; --shadow:none;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-style:normal}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.screen{min-height:100vh;min-height:100dvh}

/* ---------- пријава ---------- */
#login{display:flex;align-items:center;justify-content:center;padding:24px 20px calc(24px + var(--safe-b))}
.login-box{width:100%;max-width:380px}
.logo{width:76px;height:76px;border-radius:20px;display:block;margin:0 auto 14px;box-shadow:var(--shadow)}
h1{font-size:28px;margin:0;text-align:center}
.sub{color:var(--muted);text-align:center;margin:4px 0 26px}
label.f{display:block;font-size:14px;color:var(--muted);margin:14px 0 6px}
input.in,textarea.in{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;
  padding:14px;outline:none}
input.in:focus,textarea.in:focus{border-color:var(--acc2);box-shadow:0 0 0 3px rgba(33,163,102,.18)}
textarea.in{min-height:84px;resize:vertical}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-weight:600;cursor:pointer;
  background:var(--acc);color:#fff;margin-top:22px}
.btn:disabled{opacity:.45}
.btn:active:not(:disabled){transform:scale(.99)}
.err{color:var(--danger);min-height:22px;margin-top:12px;text-align:center;font-size:15px}

/* ---------- горња трака ---------- */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + var(--safe-t)) 16px 8px;
  border-bottom:1px solid var(--line)}
.toprow{display:flex;align-items:center;gap:10px}
.toptitle{flex:1;min-width:0}
.toptitle b{display:block;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toptitle span{color:var(--muted);font-size:14px}
.icon-btn{border:0;background:var(--card);box-shadow:var(--shadow);height:42px;min-width:42px;border-radius:12px;
  font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0 10px}
.icon-btn.txt{font-size:14px;font-weight:600;padding:0 14px}
.icon-btn.spin{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.search{margin-top:10px}
.sortrow{display:flex;align-items:center;gap:8px;margin-top:8px}
.sortrow .lbl{color:var(--muted);font-size:14px;white-space:nowrap}
.sortseg{display:flex;flex:1;background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:3px}
.sortseg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 4px;font-size:14px;font-weight:600;
  color:var(--muted);cursor:pointer}
.sortseg button.on{background:var(--accbg);color:var(--acc)}
.status{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:13px}
.pill{border-radius:999px;padding:4px 10px;background:var(--card);color:var(--muted);box-shadow:var(--shadow)}
.pill.ok{background:var(--accbg);color:var(--acc)}
.pill.warn{background:var(--warnbg);color:var(--warn)}
.pill.bad{background:#fde8e8;color:var(--danger)}
@media (prefers-color-scheme:dark){.pill.bad{background:#3b1d1d}}

/* ---------- листа ---------- */
.list{padding:12px 12px calc(24px + var(--safe-b))}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:10px;
  display:flex;align-items:center;gap:12px;cursor:pointer;border:1px solid transparent}
.card:active{border-color:var(--acc2)}
.card .t{flex:1;min-width:0}
.card .n{font-weight:600;font-size:17px}
.card .a{color:var(--text);opacity:.8;font-size:15px;margin-top:2px}
.card .m{color:var(--muted);font-size:13px;margin-top:1px}
.chev{color:var(--muted);font-size:22px}
.empty{text-align:center;color:var(--muted);padding:60px 24px}
.empty .big{font-size:44px;margin-bottom:8px}

/* ---------- анкета ---------- */
#form{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.back{border:0;background:none;color:var(--acc);font-size:17px;padding:8px 4px;cursor:pointer;font-weight:600}
.fbody{padding:14px 14px calc(110px + var(--safe-b))}
.person{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:16px}
.person .n{font-size:21px;font-weight:700}
.person .a{margin-top:4px}
.person .m{color:var(--muted);font-size:14px}
.extra{margin-top:10px;font-size:14px;color:var(--muted)}
.extra div{padding:2px 0}
.maplink{display:inline-block;margin-top:12px;color:var(--acc);font-weight:600;text-decoration:none}
.sec{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:16px;margin-top:12px}
.sec h3{margin:0 0 10px;font-size:16px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:88px;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;
  padding:13px 8px;font-weight:600;cursor:pointer}
.seg.grid2{display:grid;grid-template-columns:1fr 1fr}
.seg.grid2 button{min-width:0;text-align:left;padding:13px 12px}
.seg button.on{border-color:var(--acc2);background:var(--accbg);color:var(--acc)}
.consent{display:flex;gap:12px;align-items:flex-start;cursor:pointer;font-size:15px}
.consent input{width:26px;height:26px;flex:0 0 26px;accent-color:var(--acc);margin:0}
.q{margin-top:16px}
.q:first-child{margin-top:0}
.q .lbl{font-weight:600;margin-bottom:8px}
.locked{opacity:.45;pointer-events:none}
.hint{color:var(--muted);font-size:13px;margin-top:8px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + var(--safe-b));
  background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:21}
.bar .btn{margin:0;font-size:17px}

/* ---------- обавештење ---------- */
#toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translateX(-50%) translateY(20px);
  background:#1f2a24;color:#fff;padding:12px 18px;border-radius:14px;font-size:15px;opacity:0;
  transition:.25s;z-index:50;max-width:90vw;text-align:center;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- ================= ПРИЈАВА ================= -->
<section id="login" class="screen" hidden>
  <form class="login-box" id="loginForm" autocomplete="on">
    <img class="logo" src="icon-192.png" alt="">
    <h1>Терен</h1>
    <div class="sub">Пријава теренца</div>
    <label class="f" for="lu">Корисничко име</label>
    <input class="in" id="lu" name="username" autocomplete="username" autocapitalize="none"
           autocorrect="off" spellcheck="false" required>
    <label class="f" for="lp">Шифра</label>
    <input class="in" id="lp" name="password" type="password" autocomplete="current-password" required>
    <button class="btn" id="lbtn" type="submit">Пријави се</button>
    <div class="err" id="lerr" aria-live="polite"></div>
  </form>
</section>

<!-- ================= ЛИСТА АДРЕСА ================= -->
<section id="main" class="screen" hidden>
  <div class="top">
    <div class="toprow">
      <div class="toptitle"><b id="teamName">—</b><span id="userName"></span></div>
      <button class="icon-btn" id="refreshBtn" type="button" aria-label="Освежи">↻</button>
      <button class="icon-btn txt" id="logoutBtn" type="button">Одјава</button>
    </div>
    <input class="in search" id="search" type="search" placeholder="Претрага: име, улица, место…" autocomplete="off">
    <div class="sortrow">
      <span class="lbl">Сортирај:</span>
      <div class="sortseg" id="sortSeg">
        <button type="button" data-sort="prezime">Презиме</button>
        <button type="button" data-sort="adresa">Адреса</button>
        <button type="button" data-sort="stan">Стан</button>
      </div>
    </div>
    <div class="status" id="status" aria-live="polite"></div>
  </div>
  <div class="list" id="list"></div>
</section>

<!-- ================= АНКЕТА ================= -->
<section id="form" hidden>
  <div class="top"><div class="toprow">
    <button class="back" id="backBtn" type="button">‹ Назад</button>
    <div class="toptitle"></div>
  </div></div>
  <div class="fbody">
    <div class="person" id="person"></div>

    <div class="sec">
      <h3>Исход посете</h3>
      <div class="seg" data-field="ishod">
        <button type="button" data-val="anketiran">Анкетиран</button>
        <button type="button" data-val="nije_kod_kuce">4 – Није код куће</button>
        <button type="button" data-val="odbio">3 – Одбио</button>
      </div>
    </div>

    <div id="survey" hidden>
      <div class="sec">
        <label class="consent">
          <input type="checkbox" id="consent">
          <span><b>Грађанин је дао пристанак</b> да се његови одговори упишу и обрађују.</span>
        </label>
        <div class="hint">Без пристанка се одговори не уписују – изабери „3 – Одбио”.</div>
      </div>

      <div class="sec" id="questions">
        <div class="q">
          <div class="lbl">Статус:</div>
          <div class="seg grid2" data-field="podrzava">
            <button type="button" data-val="0">0 – Члан</button>
            <button type="button" data-val="1">1 – Сигуран глас</button>
            <button type="button" data-val="2">2 – Неопредељен</button>
            <button type="button" data-val="3">3 – Против</button>
            <button type="button" data-val="4">4 – Није кући</button>
            <button type="button" data-val="99">99 – Нема</button>
          </div>
        </div>
        <div class="q">
          <div class="lbl">Да ли излази на гласање?</div>
          <div class="seg" data-field="izlazi">
            <button type="button" data-val="da">Да</button>
            <button type="button" data-val="ne">Не</button>
            <button type="button" data-val="ne_zna">Не зна</button>
          </div>
        </div>
        <div class="q">
          <div class="lbl">Молба / захтев грађанина</div>
          <textarea class="in" id="molba" placeholder="Упиши ако има неку молбу…"></textarea>
        </div>
      </div>
    </div>

    <div class="sec">
      <h3>Напомена теренца</h3>
      <textarea class="in" id="napomena" placeholder="Опционо (нпр. доћи поново после 17 ч)"></textarea>
    </div>
  </div>
  <div class="bar"><button class="btn" id="sendBtn" type="button" disabled>ОК – пошаљи</button></div>
</section>

<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ============================ ПОДЕШАВАЊА ============================ */
const CFG = {
  url: "https://ypyrzcaodduoxvnxxjml.supabase.co",
  key: "sb_publishable_JtXUDPjL_eRyKSvaBSW81A_SOygBiD2",   // јавни кључ – заштита је преко пријаве и RLS
  domain: "teren.local",
  poll: 30000
};
const K = { session: "teren_session", profile: "teren_profile", tasks: "teren_tasks",
            queue: "teren_queue", user: "teren_last_user", sort: "teren_sort" };

/* ============================ ПОМОЋНО ============================ */
const $ = s => document.querySelector(s);
const load = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const save = (k, v) => { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); };
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(16).slice(2));

/* Латиница -> ћирилица (само за приказ; подаци у бази остају исти) */
const DIGRAPH = { "Lj": "Љ", "LJ": "Љ", "lj": "љ", "lJ": "љ", "Nj": "Њ", "NJ": "Њ", "nj": "њ", "nJ": "њ",
                  "Dž": "Џ", "DŽ": "Џ", "dž": "џ", "dŽ": "џ" };
const SINGLE = { a:"а",b:"б",c:"ц",č:"ч",ć:"ћ",d:"д",đ:"ђ",e:"е",f:"ф",g:"г",h:"х",i:"и",j:"ј",k:"к",l:"л",
  m:"м",n:"н",o:"о",p:"п",r:"р",s:"с",š:"ш",t:"т",u:"у",v:"в",z:"з",ž:"ж",
  A:"А",B:"Б",C:"Ц",Č:"Ч",Ć:"Ћ",D:"Д",Đ:"Ђ",E:"Е",F:"Ф",G:"Г",H:"Х",I:"И",J:"Ј",K:"К",L:"Л",
  M:"М",N:"Н",O:"О",P:"П",R:"Р",S:"С",Š:"Ш",T:"Т",U:"У",V:"В",Z:"З",Ž:"Ж" };
function cyr(s) {
  if (s == null) return "";
  return String(s)
    .replace(/Lj|LJ|lj|lJ|Nj|NJ|nj|nJ|Dž|DŽ|dž|dŽ/g, m => DIGRAPH[m])
    .replace(/[A-Za-zČčĆćĐđŠšŽž]/g, ch => SINGLE[ch] || ch);
}
const coll = new Intl.Collator("sr-Cyrl", { numeric: true, sensitivity: "base" });
function cmp(a, b) {                       // празно увек на крај
  a = a == null ? "" : String(a); b = b == null ? "" : String(b);
  if (!a && b) return 1;
  if (a && !b) return -1;
  return coll.compare(a, b);
}
function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
}

let session = load(K.session);
let profile = load(K.profile);
let tasks = load(K.tasks) || [];
let queue = load(K.queue) || [];
let sortBy = load(K.sort) || "adresa";
let current = null;
let form = {};
let online = navigator.onLine;
let syncing = false;
let lastSync = null;
let pollTimer = null;

function toast(msg, ms) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("show"), ms || 2600);
}

/* ============================ МРЕЖА ============================ */
class NetError extends Error {}
class ApiError extends Error {
  constructor(status, code, msg) { super(msg); this.status = status; this.code = code || ""; }
}

const SR = [
  ["invalid_credentials", "Погрешно корисничко име или шифра."],
  ["invalid login credentials", "Погрешно корисничко име или шифра."],
  ["user_banned", "Овај налог је онемогућен."],
  ["user is banned", "Овај налог је онемогућен."],
  ["email not confirmed", "Налог није активиран. Јави се администратору."],
  ["does not exist", "База није ажурирана – администратор треба да покрене teren_baza_3.sql."],
  ["violates check constraint", "База није ажурирана – администратор треба да покрене teren_baza_3.sql."]
];
function srMsg(m) {
  const low = (m || "").toLowerCase();
  for (const [k, v] of SR) if (low.includes(k)) return v;
  return m || "Грешка на серверу.";
}

async function http(method, path, opt) {
  opt = opt || {};
  let url = CFG.url + path;
  if (opt.params) url += (url.includes("?") ? "&" : "?") + new URLSearchParams(opt.params);
  const h = { apikey: CFG.key, "Content-Type": "application/json", Accept: "application/json" };
  if (opt.auth !== false) { await ensureToken(); h.Authorization = "Bearer " + session.access; }
  if (opt.prefer) h.Prefer = opt.prefer;
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 20000);
  let r;
  try {
    r = await fetch(url, { method, headers: h, cache: "no-store", signal: ctl.signal,
                           body: opt.body == null ? undefined : JSON.stringify(opt.body) });
  } catch (e) {
    throw new NetError("Нема интернета.");
  } finally { clearTimeout(timer); }
  const txt = await r.text();
  let j = null;
  try { j = txt ? JSON.parse(txt) : null; } catch (e) { j = null; }
  if (!r.ok) {
    const msg = j ? [j.message, j.msg, j.error_description, j.error_code, j.error].filter(Boolean).join(" ") : txt;
    throw new ApiError(r.status, j && (j.code || j.error_code), srMsg(msg) || ("HTTP " + r.status));
  }
  return j;
}

function jwtSub(token) {
  try {
    const p = token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
    return JSON.parse(decodeURIComponent(escape(atob(p)))).sub;
  } catch (e) { return null; }
}

function setSession(d) {
  session = {
    access: d.access_token,
    refresh: d.refresh_token,
    exp: Math.floor(Date.now() / 1000) + (parseInt(d.expires_in, 10) || 3600),
    uid: (d.user && d.user.id) || jwtSub(d.access_token)
  };
  save(K.session, session);
}

let refreshing = null;
async function ensureToken() {
  if (!session || !session.access) throw new ApiError(401, "no_session", "Ниси пријављен.");
  if (Date.now() / 1000 < session.exp - 60) return;
  if (!refreshing) {
    refreshing = (async () => {
      try {
        const d = await http("POST", "/auth/v1/token", { auth: false, params: { grant_type: "refresh_token" },
                                                        body: { refresh_token: session.refresh } });
        setSession(d);
      } catch (e) {
        if (e instanceof ApiError) throw new ApiError(401, "refresh_failed", "Сесија је истекла. Пријави се поново.");
        throw e;
      } finally { refreshing = null; }
    })();
  }
  return refreshing;
}

/* ============================ ПРИЈАВА ============================ */
async function login(username, password) {
  const u = username.trim().toLowerCase();
  const email = u.includes("@") ? u : u + "@" + CFG.domain;
  const d = await http("POST", "/auth/v1/token", { auth: false, params: { grant_type: "password" },
                                                  body: { email, password } });
  setSession(d);
  save(K.user, u.split("@")[0]);
  await loadProfile();
}

async function loadProfile() {
  const rows = await http("GET", "/rest/v1/profiles", {
    params: { select: "username,full_name,team_id,active", id: "eq." + session.uid } });
  if (!rows || !rows.length) throw new ApiError(403, "no_profile", "Налог нема профил. Јави се администратору.");
  const p = rows[0];
  if (!p.active) throw new ApiError(403, "inactive", "Овај налог је онемогућен.");
  let teamName = "";
  if (p.team_id) {
    const t = await http("GET", "/rest/v1/teams", { params: { select: "name", id: "eq." + p.team_id } });
    teamName = t && t.length ? t[0].name : "";
  }
  profile = { username: p.username, full_name: p.full_name || "", team_id: p.team_id, team_name: teamName };
  save(K.profile, profile);
}

function logout(msg) {
  session = null; profile = null; tasks = []; queue = [];
  [K.session, K.profile, K.tasks, K.queue].forEach(k => save(k, null));
  stopPolling();
  closeForm(true);
  showLogin(msg || "");
}

/* ============================ ПОДАЦИ ============================ */
async function loadTasks() {
  const rows = await http("GET", "/rest/v1/tasks", {
    params: { select: "id,ime,prezime,adresa,mesto,sprat,stan,extra,assigned_at", status: "eq.dodeljeno",
              limit: "5000" } });
  tasks = rows || [];
  save(K.tasks, tasks);
}

async function flushQueue() {
  if (!queue.length) return;
  for (const item of queue.slice()) {
    try {
      await http("POST", "/rest/v1/surveys", { body: item.payload, prefer: "return=minimal" });
      dropFromQueue(item.qid);
    } catch (e) {
      if (e instanceof NetError) throw e;
      if (e.status === 401) throw e;
      if (e.status === 409 || e.code === "23505") {
        dropFromQueue(item.qid);
        toast("„" + item.label + "” је већ завршио неко други из тима.", 3500);
      } else if (e.status === 403 || e.code === "42501") {
        dropFromQueue(item.qid);
        toast("„" + item.label + "” више није додељена твом тиму – анкета није послата.", 4000);
      } else {
        dropFromQueue(item.qid);
        toast("Анкета за „" + item.label + "” одбијена: " + e.message, 4500);
      }
    }
  }
}
function dropFromQueue(qid) {
  const item = queue.find(q => q.qid === qid);
  queue = queue.filter(q => q.qid !== qid);
  save(K.queue, queue);
  if (item) {                        // адреса је обрађена – склони је са листе одмах
    tasks = tasks.filter(t => t.id !== item.payload.task_id);
    save(K.tasks, tasks);
  }
}

async function sync(manual) {
  if (!session || syncing) return;
  syncing = true;
  $("#refreshBtn").classList.add("spin");
  try {
    await flushQueue();
    await loadProfile();
    await loadTasks();
    online = true;
    lastSync = new Date();
    if (manual) toast("Освежено");
  } catch (e) {
    if (e instanceof NetError) {
      online = false;
      if (manual) toast("Нема интернета – приказујем сачуване адресе.");
    } else if (e.status === 401 || e.code === "inactive" || e.code === "no_profile") {
      syncing = false;
      $("#refreshBtn").classList.remove("spin");
      logout(e.message);
      return;
    } else {
      toast(e.message, 4500);
    }
  } finally {
    syncing = false;
    $("#refreshBtn").classList.remove("spin");
  }
  renderMain();
}

function startPolling() {
  stopPolling();
  pollTimer = setInterval(() => { if (document.visibilityState === "visible") sync(false); }, CFG.poll);
}
function stopPolling() { if (pollTimer) clearInterval(pollTimer); pollTimer = null; }

/* ============================ ПОЉА АДРЕСЕ ============================ */
const EXTRA_SPRAT = /^(sprat|спрат)$/i;
const EXTRA_STAN = /^(stan|стан|br\.?\s*stana|број\s*стана|broj\s*stana)$/i;
function extraOf(t) { return t.extra && typeof t.extra === "object" ? t.extra : {}; }
function fromExtra(t, rx) {
  const e = extraOf(t);
  for (const k of Object.keys(e)) if (rx.test(k.trim()) && e[k] !== "" && e[k] != null) return String(e[k]);
  return "";
}
const sprat = t => (t.sprat != null && String(t.sprat).trim() !== "") ? String(t.sprat).trim() : fromExtra(t, EXTRA_SPRAT);
const stan  = t => (t.stan  != null && String(t.stan).trim()  !== "") ? String(t.stan).trim()  : fromExtra(t, EXTRA_STAN);
const fullName = t => cyr([t.ime, t.prezime].filter(Boolean).join(" ")) || "(без имена)";
function addrLine(t) {                     // „Улица 10, спрат 4, стан 20”
  const parts = [];
  if (t.adresa) parts.push(cyr(t.adresa));
  if (sprat(t)) parts.push("спрат " + cyr(sprat(t)));
  if (stan(t)) parts.push("стан " + cyr(stan(t)));
  return parts.join(", ");
}

/* ============================ ПРИКАЗ ============================ */
function show(id) {
  ["#login", "#main"].forEach(s => { $(s).hidden = (s !== id); });
}

function showLogin(msg) {
  show("#login");
  $("#lerr").textContent = msg || "";
  $("#lu").value = load(K.user) || "";
  $("#lp").value = "";
  ($("#lu").value ? $("#lp") : $("#lu")).focus();
}

function sortTasks(list) {
  const s = sortBy;
  return list.slice().sort((a, b) => {
    let r = 0;
    if (s === "prezime") {
      r = cmp(cyr(a.prezime), cyr(b.prezime)) || cmp(cyr(a.ime), cyr(b.ime));
    } else if (s === "stan") {
      r = cmp(stan(a), stan(b)) || cmp(cyr(a.adresa), cyr(b.adresa));
    }
    return r || cmp(cyr(a.mesto), cyr(b.mesto)) || cmp(cyr(a.adresa), cyr(b.adresa))
             || cmp(sprat(a), sprat(b)) || cmp(stan(a), stan(b)) || cmp(cyr(a.prezime), cyr(b.prezime));
  });
}

function visibleTasks() {
  const pending = new Set(queue.map(q => q.payload.task_id));
  const q = cyr($("#search").value.trim()).toLowerCase();
  const list = tasks.filter(t => !pending.has(t.id)).filter(t => {
    if (!q) return true;
    return cyr([t.ime, t.prezime, t.adresa, t.mesto, sprat(t), stan(t)].join(" ")).toLowerCase().includes(q);
  });
  return sortTasks(list);
}

function renderSort() {
  document.querySelectorAll("#sortSeg button").forEach(b => b.classList.toggle("on", b.dataset.sort === sortBy));
}

function renderMain() {
  if (!profile) return;
  $("#teamName").textContent = cyr(profile.team_name) || "Без тима";
  $("#userName").textContent = cyr(profile.full_name || profile.username);
  renderSort();

  const list = visibleTasks();
  const total = tasks.filter(t => !queue.some(q => q.payload.task_id === t.id)).length;
  const st = [];
  st.push(`<span class="pill">${total} ${plural(total, "адреса", "адресе", "адреса")}</span>`);
  st.push(online ? `<span class="pill ok">● На мрежи</span>` : `<span class="pill bad">● Без интернета</span>`);
  if (queue.length) st.push(`<span class="pill warn">⏳ Чека слање: ${queue.length}</span>`);
  if (lastSync) st.push(`<span class="pill">${lastSync.toLocaleTimeString("sr-Cyrl-RS", { hour: "2-digit", minute: "2-digit" })}</span>`);
  $("#status").innerHTML = st.join("");

  const box = $("#list");
  if (!profile.team_id) {
    box.innerHTML = `<div class="empty"><div class="big">👥</div>Ниси распоређен ни у један тим.<br>Јави се администратору.</div>`;
    return;
  }
  if (!list.length) {
    box.innerHTML = $("#search").value.trim()
      ? `<div class="empty"><div class="big">🔍</div>Нема резултата претраге.</div>`
      : `<div class="empty"><div class="big">✅</div>Нема додељених адреса.<br>Нове ће се појавити саме.</div>`;
    return;
  }
  box.innerHTML = list.map(t => `
    <div class="card" data-id="${esc(t.id)}" role="button" tabindex="0">
      <div class="t">
        <div class="n">${esc(fullName(t))}</div>
        <div class="a">${esc(addrLine(t))}</div>
        ${t.mesto ? `<div class="m">${esc(cyr(t.mesto))}</div>` : ""}
      </div>
      <div class="chev">›</div>
    </div>`).join("");
}

/* ============================ АНКЕТА ============================ */
function openForm(id) {
  current = tasks.find(t => t.id === id);
  if (!current) return;
  form = { ishod: null, pristanak: false, podrzava: null, izlazi: null };
  $("#consent").checked = false;
  $("#molba").value = "";
  $("#napomena").value = "";

  const extra = extraOf(current);
  const extraHtml = Object.keys(extra)
    .filter(k => extra[k] !== "" && extra[k] != null && !EXTRA_SPRAT.test(k.trim()) && !EXTRA_STAN.test(k.trim()))
    .map(k => `<div><b>${esc(cyr(k))}:</b> ${esc(cyr(extra[k]))}</div>`).join("");
  const q = encodeURIComponent([current.adresa, current.mesto, "Srbija"].filter(Boolean).join(", "));
  $("#person").innerHTML = `
    <div class="n">${esc(fullName(current))}</div>
    <div class="a">${esc(addrLine(current))}</div>
    ${current.mesto ? `<div class="m">${esc(cyr(current.mesto))}</div>` : ""}
    ${extraHtml ? `<div class="extra">${extraHtml}</div>` : ""}
    <a class="maplink" href="https://www.openstreetmap.org/search?query=${q}" target="_blank" rel="noopener">📍 Отвори на мапи</a>`;

  $("#form").hidden = false;
  $("#form").scrollTop = 0;
  document.body.style.overflow = "hidden";
  history.pushState({ form: true }, "");
  renderForm();
}

function closeForm(silent) {
  if ($("#form").hidden) return;
  $("#form").hidden = true;
  document.body.style.overflow = "";
  current = null;
  if (!silent && history.state && history.state.form) history.back();
}

function renderForm() {
  document.querySelectorAll("#form .seg").forEach(seg => {
    const f = seg.dataset.field;
    seg.querySelectorAll("button").forEach(b => b.classList.toggle("on", form[f] === b.dataset.val));
  });
  const anket = form.ishod === "anketiran";
  $("#survey").hidden = !anket;
  $("#questions").classList.toggle("locked", !(anket && form.pristanak));
  const valid = !!form.ishod && (!anket || (form.pristanak && form.podrzava && form.izlazi));
  $("#sendBtn").disabled = !valid;
}

async function submitForm() {
  if (!current) return;
  const anket = form.ishod === "anketiran";
  if (anket && !form.pristanak) { toast("Без пристанка не може – изабери „3 – Одбио”."); return; }
  const payload = {
    task_id: current.id,
    ishod: form.ishod,
    pristanak: anket,
    podrzava: anket ? form.podrzava : null,
    izlazi: anket ? form.izlazi : null,
    molba: anket ? $("#molba").value.trim() : "",
    napomena: $("#napomena").value.trim()
  };
  const label = fullName(current);
  queue.push({ qid: uid(), label, payload, at: Date.now() });
  save(K.queue, queue);
  closeForm(false);
  renderMain();
  try {
    await flushQueue();
    online = true;
    toast("✔ Послато");
  } catch (e) {
    if (e instanceof NetError) {
      online = false;
      toast("Сачувано на телефону – послаће се само кад буде интернета.", 3500);
    } else if (e.status === 401) {
      toast("Сесија је истекла – анкета чека; пријави се поново.", 4000);
    }
  }
  renderMain();
}

/* ============================ ДОГАЂАЈИ ============================ */
$("#loginForm").addEventListener("submit", async ev => {
  ev.preventDefault();
  const btn = $("#lbtn");
  $("#lerr").textContent = "";
  if (!$("#lu").value.trim() || !$("#lp").value) { $("#lerr").textContent = "Упиши корисничко име и шифру."; return; }
  btn.disabled = true; btn.textContent = "Пријављивање…";
  try {
    await login($("#lu").value, $("#lp").value);
    queue = load(K.queue) || [];
    tasks = [];
    show("#main");
    renderMain();
    await sync(false);
    startPolling();
  } catch (e) {
    session = null; save(K.session, null);
    $("#lerr").textContent = e instanceof NetError ? "Нема интернета. Провери везу." : e.message;
  } finally {
    btn.disabled = false; btn.textContent = "Пријави се";
  }
});

$("#list").addEventListener("click", ev => {
  const c = ev.target.closest(".card");
  if (c) openForm(c.dataset.id);
});
$("#list").addEventListener("keydown", ev => {
  const c = ev.target.closest(".card");
  if (c && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); openForm(c.dataset.id); }
});
$("#search").addEventListener("input", renderMain);
$("#sortSeg").addEventListener("click", ev => {
  const b = ev.target.closest("button");
  if (!b) return;
  sortBy = b.dataset.sort;
  save(K.sort, sortBy);
  renderMain();
});
$("#refreshBtn").addEventListener("click", () => sync(true));
$("#logoutBtn").addEventListener("click", () => {
  const msg = queue.length
    ? `Имаш ${queue.length} непослатих анкета. Ако се одјавиш, БИЋЕ ИЗГУБЉЕНЕ. Одјавити се?`
    : "Одјавити се?";
  if (confirm(msg)) logout("");
});

document.querySelectorAll("#form .seg").forEach(seg => {
  seg.addEventListener("click", ev => {
    const b = ev.target.closest("button");
    if (!b) return;
    const f = seg.dataset.field;
    form[f] = form[f] === b.dataset.val && f !== "ishod" ? null : b.dataset.val;
    if (f === "ishod" && form.ishod !== "anketiran") {
      form.pristanak = false; form.podrzava = null; form.izlazi = null;
      $("#consent").checked = false; $("#molba").value = "";
    }
    renderForm();
  });
});
$("#consent").addEventListener("change", ev => {
  form.pristanak = ev.target.checked;
  if (!form.pristanak) { form.podrzava = null; form.izlazi = null; $("#molba").value = ""; }
  renderForm();
});
$("#backBtn").addEventListener("click", () => closeForm(false));
$("#sendBtn").addEventListener("click", submitForm);
window.addEventListener("popstate", () => closeForm(true));

window.addEventListener("online", () => { online = true; sync(false); });
window.addEventListener("offline", () => { online = false; renderMain(); });
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && session) sync(false);
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

/* ============================ СТАРТ ============================ */
if (session && profile) {
  show("#main");
  renderMain();
  sync(false);
  startPolling();
} else {
  showLogin("");
}
</script>
</body>
</html>
