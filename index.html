<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d6f42">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Teren">
<title>Teren</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#f3f5f4; --card:#ffffff; --text:#14181a; --muted:#6b7378; --line:#e3e7e5;
  --acc:#1d8a55; --acc2:#21a366; --accbg:#e4f4ec; --danger:#d93f3f; --warn:#c77a00; --warnbg:#fff4de;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#111315; --card:#1c1f22; --text:#eef1f2; --muted:#9aa3a8; --line:#2c3135;
        --accbg:#173326; --warnbg:#3a2e14; --shadow:none;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.screen{min-height:100vh;min-height:100dvh}

/* ---------- login ---------- */
#login{display:flex;align-items:center;justify-content:center;padding:24px 20px calc(24px + var(--safe-b))}
.login-box{width:100%;max-width:380px}
.logo{width:76px;height:76px;border-radius:20px;display:block;margin:0 auto 14px;box-shadow:var(--shadow)}
h1{font-size:28px;margin:0;text-align:center}
.sub{color:var(--muted);text-align:center;margin:4px 0 26px}
label.f{display:block;font-size:14px;color:var(--muted);margin:14px 0 6px}
input.in,textarea.in{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;
  padding:14px;outline:none}
input.in:focus,textarea.in:focus{border-color:var(--acc2);box-shadow:0 0 0 3px rgba(33,163,102,.18)}
textarea.in{min-height:84px;resize:vertical}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-weight:600;cursor:pointer;
  background:var(--acc);color:#fff;margin-top:22px}
.btn:disabled{opacity:.45}
.btn:active:not(:disabled){transform:scale(.99)}
.err{color:var(--danger);min-height:22px;margin-top:12px;text-align:center;font-size:15px}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + var(--safe-t)) 16px 8px;
  border-bottom:1px solid var(--line)}
.toprow{display:flex;align-items:center;gap:10px}
.toptitle{flex:1;min-width:0}
.toptitle b{display:block;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toptitle span{color:var(--muted);font-size:14px}
.icon-btn{border:0;background:var(--card);box-shadow:var(--shadow);width:42px;height:42px;border-radius:12px;
  font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.icon-btn.txt{width:auto;padding:0 14px;font-size:14px;font-weight:600}
.icon-btn.spin{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.search{margin-top:10px}
.status{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:13px}
.pill{border-radius:999px;padding:4px 10px;background:var(--card);color:var(--muted);box-shadow:var(--shadow)}
.pill.ok{background:var(--accbg);color:var(--acc)}
.pill.warn{background:var(--warnbg);color:var(--warn)}
.pill.bad{background:#fde8e8;color:var(--danger)}
@media (prefers-color-scheme:dark){.pill.bad{background:#3b1d1d}}

/* ---------- list ---------- */
.list{padding:12px 12px calc(24px + var(--safe-b))}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:10px;
  display:flex;align-items:center;gap:12px;cursor:pointer;border:1px solid transparent}
.card:active{border-color:var(--acc2)}
.card .t{flex:1;min-width:0}
.card .n{font-weight:600;font-size:17px}
.card .a{color:var(--muted);font-size:15px;margin-top:2px}
.chev{color:var(--muted);font-size:22px}
.empty{text-align:center;color:var(--muted);padding:60px 24px}
.empty .big{font-size:44px;margin-bottom:8px}

/* ---------- form ---------- */
#form{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.back{border:0;background:none;color:var(--acc);font-size:17px;padding:8px 4px;cursor:pointer;font-weight:600}
.fbody{padding:14px 14px calc(110px + var(--safe-b))}
.person{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:16px}
.person .n{font-size:21px;font-weight:700}
.person .a{color:var(--muted);margin-top:4px}
.extra{margin-top:10px;font-size:14px;color:var(--muted)}
.extra div{padding:2px 0}
.maplink{display:inline-block;margin-top:12px;color:var(--acc);font-weight:600;text-decoration:none}
.sec{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:16px;margin-top:12px}
.sec h3{margin:0 0 10px;font-size:16px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:88px;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;
  padding:13px 8px;font-weight:600;cursor:pointer}
.seg button.on{border-color:var(--acc2);background:var(--accbg);color:var(--acc)}
.seg button:disabled{opacity:.4}
.consent{display:flex;gap:12px;align-items:flex-start;cursor:pointer;font-size:15px}
.consent input{width:26px;height:26px;flex:0 0 26px;accent-color:var(--acc);margin:0}
.q{margin-top:16px}
.q:first-child{margin-top:0}
.q .lbl{font-weight:600;margin-bottom:8px}
.locked{opacity:.45;pointer-events:none}
.hint{color:var(--muted);font-size:13px;margin-top:8px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + var(--safe-b));
  background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:21}
.bar .btn{margin:0;font-size:17px}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translateX(-50%) translateY(20px);
  background:#1f2a24;color:#fff;padding:12px 18px;border-radius:14px;font-size:15px;opacity:0;
  transition:.25s;z-index:50;max-width:90vw;text-align:center;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- ================= PRIJAVA ================= -->
<section id="login" class="screen" hidden>
  <form class="login-box" id="loginForm" autocomplete="on">
    <img class="logo" src="icon-192.png" alt="">
    <h1>Teren</h1>
    <div class="sub">Prijava terenca</div>
    <label class="f" for="lu">Korisničko ime</label>
    <input class="in" id="lu" name="username" autocomplete="username" autocapitalize="none"
           autocorrect="off" spellcheck="false" required>
    <label class="f" for="lp">Šifra</label>
    <input class="in" id="lp" name="password" type="password" autocomplete="current-password" required>
    <button class="btn" id="lbtn" type="submit">Prijavi se</button>
    <div class="err" id="lerr" aria-live="polite"></div>
  </form>
</section>

<!-- ================= LISTA ADRESA ================= -->
<section id="main" class="screen" hidden>
  <div class="top">
    <div class="toprow">
      <div class="toptitle"><b id="teamName">—</b><span id="userName"></span></div>
      <button class="icon-btn" id="refreshBtn" type="button" aria-label="Osveži">↻</button>
      <button class="icon-btn txt" id="logoutBtn" type="button">Odjava</button>
    </div>
    <input class="in search" id="search" type="search" placeholder="Pretraga: ime, ulica, mesto…" autocomplete="off">
    <div class="status" id="status" aria-live="polite"></div>
  </div>
  <div class="list" id="list"></div>
</section>

<!-- ================= ANKETA ================= -->
<section id="form" hidden>
  <div class="top"><div class="toprow">
    <button class="back" id="backBtn" type="button">‹ Nazad</button>
    <div class="toptitle"></div>
  </div></div>
  <div class="fbody">
    <div class="person" id="person"></div>

    <div class="sec">
      <h3>Ishod posete</h3>
      <div class="seg" data-field="ishod">
        <button type="button" data-val="anketiran">Anketiran</button>
        <button type="button" data-val="nije_kod_kuce">Nije kod kuće</button>
        <button type="button" data-val="odbio">Odbio</button>
      </div>
    </div>

    <div id="survey" hidden>
      <div class="sec">
        <label class="consent">
          <input type="checkbox" id="consent">
          <span><b>Građanin je dao pristanak</b> da se njegovi odgovori upišu i obrađuju.</span>
        </label>
        <div class="hint">Bez pristanka se odgovori ne upisuju – izaberi „Odbio”.</div>
      </div>

      <div class="sec" id="questions">
        <div class="q">
          <div class="lbl">Da li podržava rad stranke?</div>
          <div class="seg" data-field="podrzava">
            <button type="button" data-val="da">Da</button>
            <button type="button" data-val="ne">Ne</button>
            <button type="button" data-val="neodlucan">Neodlučan</button>
          </div>
        </div>
        <div class="q">
          <div class="lbl">Da li izlazi na glasanje?</div>
          <div class="seg" data-field="izlazi">
            <button type="button" data-val="da">Da</button>
            <button type="button" data-val="ne">Ne</button>
            <button type="button" data-val="ne_zna">Ne zna</button>
          </div>
        </div>
        <div class="q">
          <div class="lbl">Molba / zahtev građanina</div>
          <textarea class="in" id="molba" placeholder="Upiši ako ima neku molbu…"></textarea>
        </div>
      </div>
    </div>

    <div class="sec">
      <h3>Napomena terenca</h3>
      <textarea class="in" id="napomena" placeholder="Opciono (npr. doći ponovo posle 17h)"></textarea>
    </div>
  </div>
  <div class="bar"><button class="btn" id="sendBtn" type="button" disabled>OK – pošalji</button></div>
</section>

<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ============================ PODEŠAVANJA ============================ */
const CFG = {
  url: "https://ypyrzcaodduoxvnxxjml.supabase.co",
  key: "sb_publishable_JtXUDPjL_eRyKSvaBSW81A_SOygBiD2",   // javni ključ – zaštita je preko prijave i RLS
  domain: "teren.local",
  poll: 30000
};
const K = { session: "teren_session", profile: "teren_profile", tasks: "teren_tasks",
            queue: "teren_queue", user: "teren_last_user" };

/* ============================ POMOĆNO ============================ */
const $ = s => document.querySelector(s);
const load = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const save = (k, v) => { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); };
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(16).slice(2));

let session = load(K.session);
let profile = load(K.profile);
let tasks = load(K.tasks) || [];
let queue = load(K.queue) || [];
let current = null;
let form = {};
let online = navigator.onLine;
let syncing = false;
let lastSync = null;
let pollTimer = null;

function toast(msg, ms) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("show"), ms || 2600);
}

/* ============================ MREŽA ============================ */
class NetError extends Error {}
class ApiError extends Error {
  constructor(status, code, msg) { super(msg); this.status = status; this.code = code || ""; }
}

const SR = [
  ["invalid_credentials", "Pogrešno korisničko ime ili šifra."],
  ["invalid login credentials", "Pogrešno korisničko ime ili šifra."],
  ["user_banned", "Ovaj nalog je onemogućen."],
  ["user is banned", "Ovaj nalog je onemogućen."],
  ["email not confirmed", "Nalog nije aktiviran. Javi se administratoru."]
];
function srMsg(m) {
  const low = (m || "").toLowerCase();
  for (const [k, v] of SR) if (low.includes(k)) return v;
  return m || "Greška na serveru.";
}

async function http(method, path, opt) {
  opt = opt || {};
  let url = CFG.url + path;
  if (opt.params) url += (url.includes("?") ? "&" : "?") + new URLSearchParams(opt.params);
  const h = { apikey: CFG.key, "Content-Type": "application/json", Accept: "application/json" };
  if (opt.auth !== false) { await ensureToken(); h.Authorization = "Bearer " + session.access; }
  if (opt.prefer) h.Prefer = opt.prefer;
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 20000);
  let r;
  try {
    r = await fetch(url, { method, headers: h, cache: "no-store", signal: ctl.signal,
                           body: opt.body == null ? undefined : JSON.stringify(opt.body) });
  } catch (e) {
    throw new NetError("Nema interneta.");
  } finally { clearTimeout(timer); }
  const txt = await r.text();
  let j = null;
  try { j = txt ? JSON.parse(txt) : null; } catch (e) { j = null; }
  if (!r.ok) {
    const msg = j ? [j.message, j.msg, j.error_description, j.error_code, j.error].filter(Boolean).join(" ") : txt;
    throw new ApiError(r.status, j && (j.code || j.error_code), srMsg(msg) || ("HTTP " + r.status));
  }
  return j;
}

function jwtSub(token) {
  try {
    const p = token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
    return JSON.parse(decodeURIComponent(escape(atob(p)))).sub;
  } catch (e) { return null; }
}

function setSession(d) {
  session = {
    access: d.access_token,
    refresh: d.refresh_token,
    exp: Math.floor(Date.now() / 1000) + (parseInt(d.expires_in, 10) || 3600),
    uid: (d.user && d.user.id) || jwtSub(d.access_token)
  };
  save(K.session, session);
}

let refreshing = null;
async function ensureToken() {
  if (!session || !session.access) throw new ApiError(401, "no_session", "Nisi prijavljen.");
  if (Date.now() / 1000 < session.exp - 60) return;
  if (!refreshing) {
    refreshing = (async () => {
      try {
        const d = await http("POST", "/auth/v1/token", { auth: false, params: { grant_type: "refresh_token" },
                                                        body: { refresh_token: session.refresh } });
        setSession(d);
      } catch (e) {
        if (e instanceof ApiError) throw new ApiError(401, "refresh_failed", "Sesija je istekla. Prijavi se ponovo.");
        throw e;
      } finally { refreshing = null; }
    })();
  }
  return refreshing;
}

/* ============================ PRIJAVA ============================ */
async function login(username, password) {
  const u = username.trim().toLowerCase();
  const email = u.includes("@") ? u : u + "@" + CFG.domain;
  const d = await http("POST", "/auth/v1/token", { auth: false, params: { grant_type: "password" },
                                                  body: { email, password } });
  setSession(d);
  save(K.user, u.split("@")[0]);
  await loadProfile();
}

async function loadProfile() {
  const rows = await http("GET", "/rest/v1/profiles", {
    params: { select: "username,full_name,team_id,active", id: "eq." + session.uid } });
  if (!rows || !rows.length) throw new ApiError(403, "no_profile", "Nalog nema profil. Javi se administratoru.");
  const p = rows[0];
  if (!p.active) throw new ApiError(403, "inactive", "Ovaj nalog je onemogućen.");
  let teamName = "";
  if (p.team_id) {
    const t = await http("GET", "/rest/v1/teams", { params: { select: "name", id: "eq." + p.team_id } });
    teamName = t && t.length ? t[0].name : "";
  }
  profile = { username: p.username, full_name: p.full_name || "", team_id: p.team_id, team_name: teamName };
  save(K.profile, profile);
}

function logout(msg) {
  session = null; profile = null; tasks = []; queue = [];
  [K.session, K.profile, K.tasks, K.queue].forEach(k => save(k, null));
  stopPolling();
  closeForm(true);
  showLogin(msg || "");
}

/* ============================ PODACI ============================ */
async function loadTasks() {
  const rows = await http("GET", "/rest/v1/tasks", {
    params: { select: "id,ime,prezime,adresa,mesto,extra,assigned_at", status: "eq.dodeljeno",
              order: "mesto.asc,adresa.asc", limit: "5000" } });
  tasks = rows || [];
  save(K.tasks, tasks);
}

async function flushQueue() {
  if (!queue.length) return;
  for (const item of queue.slice()) {
    try {
      await http("POST", "/rest/v1/surveys", { body: item.payload, prefer: "return=minimal" });
      dropFromQueue(item.qid);
    } catch (e) {
      if (e instanceof NetError) throw e;
      if (e.status === 401) throw e;
      if (e.status === 409 || e.code === "23505") {
        dropFromQueue(item.qid);
        toast("„" + item.label + "” je već završio neko drugi iz tima.", 3500);
      } else if (e.status === 403 || e.code === "42501") {
        dropFromQueue(item.qid);
        toast("„" + item.label + "” više nije dodeljena tvom timu – anketa nije poslata.", 4000);
      } else {
        dropFromQueue(item.qid);
        toast("Anketa za „" + item.label + "” odbijena: " + e.message, 4500);
      }
    }
  }
}
function dropFromQueue(qid) {
  const item = queue.find(q => q.qid === qid);
  queue = queue.filter(q => q.qid !== qid);
  save(K.queue, queue);
  if (item) {                        // adresa je obrađena – skloni je sa liste odmah
    tasks = tasks.filter(t => t.id !== item.payload.task_id);
    save(K.tasks, tasks);
  }
}

async function sync(manual) {
  if (!session || syncing) return;
  syncing = true;
  $("#refreshBtn").classList.add("spin");
  try {
    await flushQueue();
    await loadProfile();
    await loadTasks();
    online = true;
    lastSync = new Date();
    if (manual) toast("Osveženo");
  } catch (e) {
    if (e instanceof NetError) {
      online = false;
      if (manual) toast("Nema interneta – prikazujem sačuvane adrese.");
    } else if (e.status === 401 || e.code === "inactive" || e.code === "no_profile") {
      syncing = false;
      $("#refreshBtn").classList.remove("spin");
      logout(e.message);
      return;
    } else {
      toast(e.message, 4000);
    }
  } finally {
    syncing = false;
    $("#refreshBtn").classList.remove("spin");
  }
  renderMain();
}

function startPolling() {
  stopPolling();
  pollTimer = setInterval(() => { if (document.visibilityState === "visible") sync(false); }, CFG.poll);
}
function stopPolling() { if (pollTimer) clearInterval(pollTimer); pollTimer = null; }

/* ============================ PRIKAZ ============================ */
function show(id) {
  ["#login", "#main"].forEach(s => { $(s).hidden = (s !== id); });
}

function showLogin(msg) {
  show("#login");
  $("#lerr").textContent = msg || "";
  $("#lu").value = load(K.user) || "";
  $("#lp").value = "";
  ($("#lu").value ? $("#lp") : $("#lu")).focus();
}

function visibleTasks() {
  const pending = new Set(queue.map(q => q.payload.task_id));
  const q = $("#search").value.trim().toLowerCase();
  return tasks.filter(t => !pending.has(t.id)).filter(t => {
    if (!q) return true;
    return [t.ime, t.prezime, t.adresa, t.mesto].join(" ").toLowerCase().includes(q);
  });
}

function addrLine(t) {
  return [t.adresa, t.mesto].filter(Boolean).join(", ");
}

function renderMain() {
  if (!profile) return;
  $("#teamName").textContent = profile.team_name || "Bez tima";
  $("#userName").textContent = profile.full_name || profile.username;

  const list = visibleTasks();
  const total = tasks.filter(t => !queue.some(q => q.payload.task_id === t.id)).length;
  const st = [];
  st.push(`<span class="pill">${total} ${total === 1 ? "adresa" : "adresa"}</span>`);
  st.push(online ? `<span class="pill ok">● Na mreži</span>` : `<span class="pill bad">● Bez interneta</span>`);
  if (queue.length) st.push(`<span class="pill warn">⏳ Čeka slanje: ${queue.length}</span>`);
  if (lastSync) st.push(`<span class="pill">${lastSync.toLocaleTimeString("sr-RS", { hour: "2-digit", minute: "2-digit" })}</span>`);
  $("#status").innerHTML = st.join("");

  const box = $("#list");
  if (!profile.team_id) {
    box.innerHTML = `<div class="empty"><div class="big">👥</div>Nisi raspoređen ni u jedan tim.<br>Javi se administratoru.</div>`;
    return;
  }
  if (!list.length) {
    box.innerHTML = $("#search").value.trim()
      ? `<div class="empty"><div class="big">🔍</div>Nema rezultata pretrage.</div>`
      : `<div class="empty"><div class="big">✅</div>Nema dodeljenih adresa.<br>Nove će se pojaviti same.</div>`;
    return;
  }
  box.innerHTML = list.map(t => `
    <div class="card" data-id="${esc(t.id)}" role="button" tabindex="0">
      <div class="t">
        <div class="n">${esc([t.ime, t.prezime].filter(Boolean).join(" ") || "(bez imena)")}</div>
        <div class="a">${esc(addrLine(t))}</div>
      </div>
      <div class="chev">›</div>
    </div>`).join("");
}

/* ============================ ANKETA ============================ */
function openForm(id) {
  current = tasks.find(t => t.id === id);
  if (!current) return;
  form = { ishod: null, pristanak: false, podrzava: null, izlazi: null };
  $("#consent").checked = false;
  $("#molba").value = "";
  $("#napomena").value = "";

  const extra = current.extra && typeof current.extra === "object" ? current.extra : {};
  const extraHtml = Object.keys(extra).filter(k => extra[k] !== "" && extra[k] != null)
    .map(k => `<div><b>${esc(k)}:</b> ${esc(extra[k])}</div>`).join("");
  const q = encodeURIComponent([current.adresa, current.mesto, "Srbija"].filter(Boolean).join(", "));
  $("#person").innerHTML = `
    <div class="n">${esc([current.ime, current.prezime].filter(Boolean).join(" ") || "(bez imena)")}</div>
    <div class="a">${esc(addrLine(current))}</div>
    ${extraHtml ? `<div class="extra">${extraHtml}</div>` : ""}
    <a class="maplink" href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">📍 Otvori u mapama</a>`;

  $("#form").hidden = false;
  $("#form").scrollTop = 0;
  document.body.style.overflow = "hidden";
  history.pushState({ form: true }, "");
  renderForm();
}

function closeForm(silent) {
  if ($("#form").hidden) return;
  $("#form").hidden = true;
  document.body.style.overflow = "";
  current = null;
  if (!silent && history.state && history.state.form) history.back();
}

function renderForm() {
  document.querySelectorAll("#form .seg").forEach(seg => {
    const f = seg.dataset.field;
    seg.querySelectorAll("button").forEach(b => b.classList.toggle("on", form[f] === b.dataset.val));
  });
  const anket = form.ishod === "anketiran";
  $("#survey").hidden = !anket;
  $("#questions").classList.toggle("locked", !(anket && form.pristanak));
  const valid = !!form.ishod && (!anket || (form.pristanak && form.podrzava && form.izlazi));
  $("#sendBtn").disabled = !valid;
}

async function submitForm() {
  if (!current) return;
  const anket = form.ishod === "anketiran";
  if (anket && !form.pristanak) { toast("Bez pristanka ne može – izaberi „Odbio”."); return; }
  const payload = {
    task_id: current.id,
    ishod: form.ishod,
    pristanak: anket,
    podrzava: anket ? form.podrzava : null,
    izlazi: anket ? form.izlazi : null,
    molba: anket ? $("#molba").value.trim() : "",
    napomena: $("#napomena").value.trim()
  };
  const label = [current.ime, current.prezime].filter(Boolean).join(" ") || addrLine(current);
  queue.push({ qid: uid(), label, payload, at: Date.now() });
  save(K.queue, queue);
  closeForm(false);
  renderMain();
  try {
    await flushQueue();
    online = true;
    toast("✔ Poslato");
  } catch (e) {
    if (e instanceof NetError) {
      online = false;
      toast("Sačuvano na telefonu – poslaće se samo kad bude interneta.", 3500);
    } else if (e.status === 401) {
      toast("Sesija je istekla – anketa čeka; prijavi se ponovo.", 4000);
    }
  }
  renderMain();
}

/* ============================ DOGAĐAJI ============================ */
$("#loginForm").addEventListener("submit", async ev => {
  ev.preventDefault();
  const btn = $("#lbtn");
  $("#lerr").textContent = "";
  if (!$("#lu").value.trim() || !$("#lp").value) { $("#lerr").textContent = "Upiši korisničko ime i šifru."; return; }
  btn.disabled = true; btn.textContent = "Prijavljivanje…";
  try {
    await login($("#lu").value, $("#lp").value);
    queue = load(K.queue) || [];
    tasks = [];
    show("#main");
    renderMain();
    await sync(false);
    startPolling();
  } catch (e) {
    session = null; save(K.session, null);
    $("#lerr").textContent = e instanceof NetError ? "Nema interneta. Proveri vezu." : e.message;
  } finally {
    btn.disabled = false; btn.textContent = "Prijavi se";
  }
});

$("#list").addEventListener("click", ev => {
  const c = ev.target.closest(".card");
  if (c) openForm(c.dataset.id);
});
$("#list").addEventListener("keydown", ev => {
  const c = ev.target.closest(".card");
  if (c && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); openForm(c.dataset.id); }
});
$("#search").addEventListener("input", renderMain);
$("#refreshBtn").addEventListener("click", () => sync(true));
$("#logoutBtn").addEventListener("click", () => {
  const msg = queue.length
    ? `Imaš ${queue.length} neposlatih anketa. Ako se odjaviš, BIĆE IZGUBLJENE. Odjaviti se?`
    : "Odjaviti se?";
  if (confirm(msg)) logout("");
});

document.querySelectorAll("#form .seg").forEach(seg => {
  seg.addEventListener("click", ev => {
    const b = ev.target.closest("button");
    if (!b) return;
    const f = seg.dataset.field;
    form[f] = form[f] === b.dataset.val && f !== "ishod" ? null : b.dataset.val;
    if (f === "ishod" && form.ishod !== "anketiran") {
      form.pristanak = false; form.podrzava = null; form.izlazi = null;
      $("#consent").checked = false; $("#molba").value = "";
    }
    renderForm();
  });
});
$("#consent").addEventListener("change", ev => {
  form.pristanak = ev.target.checked;
  if (!form.pristanak) { form.podrzava = null; form.izlazi = null; $("#molba").value = ""; }
  renderForm();
});
$("#backBtn").addEventListener("click", () => closeForm(false));
$("#sendBtn").addEventListener("click", submitForm);
window.addEventListener("popstate", () => closeForm(true));

window.addEventListener("online", () => { online = true; sync(false); });
window.addEventListener("offline", () => { online = false; renderMain(); });
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && session) sync(false);
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

/* ============================ START ============================ */
if (session && profile) {
  show("#main");
  renderMain();
  sync(false);
  startPolling();
} else {
  showLogin("");
}
</script>
</body>
</html>
